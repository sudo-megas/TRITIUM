# Build + verify TRITIUM for Android on a tagged release.
#
# AF11.md §1 / XTRITIUM §9.3 originally required that no signing key ever be
# stored on any server, mirroring the desktop's own package.yml. That was the
# default until the maker explicitly asked otherwise (the alternative — a
# local build on his own machine — needed tooling he wasn't willing to
# install), so this workflow now signs the release APK from a repository
# secret instead. This is a deliberate, named exception to that principle,
# not a quiet reversal of it: TRITIUM_KEYSTORE_BASE64 (the keystore, base64'd)
# and TRITIUM_KEYSTORE_PASSWORD/TRITIUM_KEY_ALIAS/TRITIUM_KEY_PASSWORD live in
# this repo's Actions secrets, decoded to a runner-local temp file that never
# leaves the job and is never written to the workflow's own logs or the
# repository. If those secrets are absent (a fork, a dry-run
# workflow_dispatch without them configured), build.gradle.kts's own
# releaseKeystore(project) returns null exactly as before and the build is,
# correctly, unsigned — this workflow does not require them to succeed.
#
# android-ci.yml is path-filtered to android/** so it never fires for the
# desktop; this fires on an explicit tag only, already a decision made on
# purpose, so no path filter here.

name: Android Release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Only a real tag has a tag to disagree with — workflow_dispatch is the
      # dry run and has none.
      - name: Check the tag agrees with versionName
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG_VERSION="${GITHUB_REF_NAME#android-v}"
          if [ "${TAG_VERSION}" != "${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${VERSION}"
            exit 1
          fi
          echo "tag and versionName agree: ${VERSION}"

      # The full suite, not the subset android-ci.yml runs on every push — a
      # release is the one build where running everything is obviously worth
      # the minutes.
      - name: Check
        run: ./gradlew --no-daemon check

      # Decodes straight to $RUNNER_TEMP, outside the working directory and
      # never committed or logged. Conditioned on the secret existing at all
      # so a fork or a secrets-less workflow_dispatch skips this cleanly
      # rather than failing on an empty `base64 -d`.
      - name: Decode the release keystore
        if: ${{ secrets.TRITIUM_KEYSTORE_BASE64 != '' }}
        env:
          TRITIUM_KEYSTORE_BASE64: ${{ secrets.TRITIUM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "${TRITIUM_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/tritium-release.jks"

      # TRITIUM_KEYSTORE_FILE only set when the decode step above actually
      # ran — build.gradle.kts's own releaseKeystore(project) reads these
      # four and returns null (an unsigned build, same as before) whenever
      # any is unset, so a secrets-less run is still correctly unsigned.
      - name: Assemble the release APK
        env:
          TRITIUM_KEYSTORE_FILE: ${{ secrets.TRITIUM_KEYSTORE_BASE64 != '' && format('{0}/tritium-release.jks', runner.temp) || '' }}
          TRITIUM_KEYSTORE_PASSWORD: ${{ secrets.TRITIUM_KEYSTORE_PASSWORD }}
          TRITIUM_KEY_ALIAS: ${{ secrets.TRITIUM_KEY_ALIAS }}
          TRITIUM_KEY_PASSWORD: ${{ secrets.TRITIUM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # One layer further out than verifyReleaseManifestPolicy: that task reads
      # the MERGED manifest before packaging; this reads the actual artifact
      # that would ship, the same belt-and-braces check the sibling Android
      # port runs on its own release build.
      - name: Sanity-check the built APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk)
          ANALYZER=$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/apkanalyzer | sort -V | tail -1)
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)

          echo "--- the zero-permission claim, on the built artefact"
          PERMISSIONS="$("${ANALYZER}" manifest permissions "${APK}")"
          if [ -n "${PERMISSIONS}" ]; then
            echo "::error::the release APK declares a permission — XTRITIUM §3 principle 1"
            echo "${PERMISSIONS}"
            exit 1
          fi
          echo "no permissions declared"

          echo "--- signature"
          "${BUILD_TOOLS}apksigner" verify --print-certs "${APK}" || echo "not signed (no keystore secret configured for this run)"

          echo "--- size"
          "${ANALYZER}" apk summary "${APK}"

      - name: Upload the release APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tritium-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

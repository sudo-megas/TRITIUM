# CI for the Android app under /android. The desktop pipeline is package.yml,
# which only triggers on a `v*` tag push or manual dispatch — it never runs on
# an ordinary push, so there is no risk of the two triggering each other. The
# `android-` prefix on release tags (AF1.md §1.1, XTRITIUM §9.1) means an
# `android-v*` tag would not even match package.yml's `v*` glob if it ever did.
#
# The debug APK uploaded by this workflow is how each AF-milestone reaches a
# real phone before there is a release to sideload instead. It is not signed —
# AF10 adds android-release.yml for that, gated on a keystore that does not
# exist until then (AF1.md §2.2).

name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'LICENSE'

# No `branches:` restriction, deliberately — every working branch gets CI,
# because AF1's own verification depends on reading real Actions runs, the
# same reasoning the family's sibling Android port states for its own
# android-ci.yml.

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      # ubuntu-24.04 already ships a JDK and the Android SDK, so there is no
      # setup-android step and no licence dance.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # No build-root-directory input: `defaults.run.working-directory` above
      # is what puts Gradle in android/. Wrapper checksum validation is on by
      # default and scans the repository, so the pinned wrapper is verified
      # here.
      - uses: gradle/actions/setup-gradle@v6

      # `check` runs, in order: buildSrc's own tests (the guardian's guardian,
      # finalized onto the jar Gradle must build anyway — buildSrc/build.gradle.kts),
      # the app's unit tests (atomic-write, settings.toml round-trip,
      # LicenceAssetParityTest), and verifyDebugManifestPolicy +
      # verifyReleaseManifestPolicy. The release manifest is verified without
      # assembling a release APK.
      - name: Check
        run: ./gradlew --no-daemon check

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # `check` never touches androidTest — those are instrumented tests that
      # need a real device or emulator, which this workflow does not provision
      # (AF1.md §3: no CI-run device tests, verified on the maker's own phone
      # or an emulator instead). Assembling the test APK anyway at least
      # compiles ShellLanguageSwitchTest.kt on every push, so a broken test
      # file is a red build rather than a silent gap discovered only when
      # someone finally runs it by hand.
      - name: Compile instrumented test sources
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      # if-no-files-found: error so a silent empty upload is impossible — an
      # artifact that exists but contains nothing is worse than a failed build.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tritium-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/manifest-policy/
            android/buildSrc/build/reports/tests/
          if-no-files-found: warn
